<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Forge Elevator — Expert elevator maintenance, repair, and modernization serving East Tennessee." />
    <title>Forge Elevator | v0.3</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Apply saved theme before React loads to prevent a flash of default colors.
      try {
        var _t = JSON.parse(localStorage.getItem('forge_theme') || 'null');
        if (_t) {
          var _d = document.documentElement;
          var _rgb = function(x) { return parseInt(x.slice(1,3),16)+' '+parseInt(x.slice(3,5),16)+' '+parseInt(x.slice(5,7),16); };
          ['navy','steel','mid','amber','fire','light','slate'].forEach(function(k) {
            if (_t[k]) _d.style.setProperty('--forge-'+k+'-rgb', _rgb(_t[k]));
          });
        }
      } catch(e) {}
    </script>
    <script>
      // Decode the path that 404.html encoded into the query string.
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
